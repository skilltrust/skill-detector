name: Feature request
description: Suggest a new rule, skill format, CLI flag, or other enhancement
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Reminder: **please open an issue
        before sending a PR**, so we can agree on the approach first.

  - type: dropdown
    id: type
    attributes:
      label: Type of request
      options:
        - "New security rule"
        - "Support for a new skill format"
        - "New CLI flag or config option"
        - "Report format change"
        - "Documentation"
        - "Other"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the use case or the gap you're hitting today.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: |
        How would you like skill-detector to behave? If it's a new rule, describe the
        threat class and how to detect it (patterns, YAML keys, file signatures, etc.).
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other tools, workarounds, or different approaches you've thought about.
    validations:
      required: false

  - type: textarea
    id: references
    attributes:
      label: References
      description: Links to OWASP entries, CVEs, blog posts, similar projects, prior art.
    validations:
      required: false
