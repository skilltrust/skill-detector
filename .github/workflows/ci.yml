name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          install-mode: binary
          args: ""

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Build
        run: make build

      # Dependabot alerts cover our module requirements; govulncheck is the
      # only check that also sees the Go standard library and, unlike an alert
      # feed, reports whether the vulnerable symbol is actually reachable from
      # our code. @latest is deliberate: the scanner is a tool, not a pinned
      # dependency, and its vulnerability DB is fetched at run time anyway.
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Self-scan
        run: make self-scan
